<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>动物模型近距离对比 — Subdivision Surface</title>
<style>
  body { margin: 0; background: #0a0e14; color: #d8e2ee; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { padding: 16px 24px; margin: 0; font-size: 18px; border-bottom: 1px solid #1e2832; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #1e2832; }
  .cell { background: #0a0e14; padding: 8px; }
  .cell h2 { font-size: 14px; margin: 0 0 8px; color: #6fc7c1; }
  .cell canvas { width: 100%; height: 380px; display: block; background: #1a2330; border-radius: 4px; }
  .note { font-size: 12px; color: #8a9aa8; margin-top: 4px; }
</style>
</head>
<body>
<h1>自然馆动物 — Subdivision Surface 近景对比</h1>
<div class="grid">
  <div class="cell"><h2>猛犸象 (Mammoth)</h2><canvas id="c1"></canvas><div class="note">肩峰+臀峰+圆顶头+弯曲象鼻+螺旋象牙</div></div>
  <div class="cell"><h2>东北虎 (Siberian Tiger)</h2><canvas id="c2"></canvas><div class="note">流线身+宽吻+关节四肢+S 形长尾</div></div>
  <div class="cell"><h2>大熊猫 (Giant Panda)</h2><canvas id="c3"></canvas><div class="note">圆胖身+黑肩带+黑眼圈+大圆头</div></div>
  <div class="cell"><h2>金丝猴 (Golden Monkey)</h2><canvas id="c4"></canvas><div class="note">坐姿+金披肩+仰鼻+蓬松尾</div></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODELS = [
  ['c1', 'mammoth.glb', 0.18],
  ['c2', 'siberian-tiger.glb', 0.22],
  ['c3', 'giant-panda.glb', 0.25],
  ['c4', 'golden-monkey.glb', 0.45],
];

for (const [id, file, scale] of MODELS) {
  const canvas = document.getElementById(id);
  const r = new THREE.WebGLRenderer({ canvas, antialias: true });
  r.setPixelRatio(2);
  r.setSize(canvas.clientWidth, canvas.clientHeight, false);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.1;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a2330);

  const cam = new THREE.PerspectiveCamera(35, canvas.clientWidth / canvas.clientHeight, 0.1, 50);
  cam.position.set(2.8, 1.8, 4.0);
  cam.lookAt(0, 0.9, 0);

  // 三点光照（无 IBL，纯直接光）
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(4, 6, 3); scene.add(key);
  const fill = new THREE.DirectionalLight(0xa8d0ff, 0.7); fill.position.set(-3, 2, 2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffd9a8, 0.6); rim.position.set(0, 3, -4); scene.add(rim);

  // 圆形地面
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(2.5, 48),
    new THREE.MeshStandardMaterial({ color: 0x2a3540, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // 鼠标拖拽（自实现，避免 OrbitControls 依赖）
  let dragging = false, lx = 0, ly = 0;
  let yaw = -0.6, pitch = 0.25, dist = 5.0;
  const target = new THREE.Vector3(0, 0.9, 0);
  canvas.addEventListener('mousedown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    yaw -= (e.clientX - lx) * 0.008;
    pitch -= (e.clientY - ly) * 0.008;
    pitch = Math.max(-0.5, Math.min(1.2, pitch));
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    dist *= 1 + Math.sign(e.deltaY) * 0.1;
    dist = Math.max(2.5, Math.min(10, dist));
  }, { passive: false });

  function updateCam() {
    cam.position.x = target.x + dist * Math.cos(pitch) * Math.sin(yaw);
    cam.position.y = target.y + dist * Math.sin(pitch);
    cam.position.z = target.z + dist * Math.cos(pitch) * Math.cos(yaw);
    cam.lookAt(target);
  }
  updateCam();

  // 加载模型
  const loader = new GLTFLoader();
  loader.load('./models/' + file, (gltf) => {
    const root = gltf.scene;
    root.scale.setScalar(scale);
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3());
    root.position.x -= c.x;
    root.position.z -= c.z;
    root.position.y -= box.min.y;
    scene.add(root);
  });

  function tick() {
    updateCam();
    r.render(scene, cam);
    requestAnimationFrame(tick);
  }
  tick();
}
</script>
</body>
</html>
