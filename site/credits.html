<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图源与授权 · 数字博物馆</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./css/site.css">
<style>
.credits { max-width: var(--maxw); margin: 0 auto; padding: 8vh 22px 10vh; }
.credits h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); margin: 0 0 0.35em; }
.credits .lede { color: var(--tx2); margin: 0 0 2.2em; max-width: 820px; }
.hall-group { margin-bottom: 2.8em; }
.hall-title { font-size: 1.15rem; color: var(--tx); margin: 0 0 0.9em; padding-bottom: 0.5em; border-bottom: 1px solid var(--line); }
.hall-title span { color: var(--tx3); font-weight: 400; margin-left: 0.6em; }
.credit-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.credit-table th,
.credit-table td { text-align: left; padding: 0.85em 0.7em; border-bottom: 1px solid var(--line); vertical-align: top; }
.credit-table th { color: var(--tx3); font-weight: 500; white-space: nowrap; }
.credit-table td { color: var(--tx2); }
.credit-table .name { color: var(--tx); font-weight: 500; }
.credit-table .era { white-space: nowrap; }
.credit-table .license { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.86em; }
@media (max-width: 720px) {
  .credit-table, .credit-table thead, .credit-table tbody, .credit-table th, .credit-table td, .credit-table tr { display: block; }
  .credit-table thead { display: none; }
  .credit-table td { padding: 0.5em 0; border: none; }
  .credit-table tr { padding: 1em 0; border-bottom: 1px solid var(--line); }
  .credit-table td::before { content: attr(data-label); display: block; color: var(--tx3); font-size: 0.82em; margin-bottom: 0.15em; }
}
</style>
</head>
<body class="page-credits">

<div class="bg-grid" aria-hidden="true"></div>

<header class="nav">
  <a class="brand" href="./index.html">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M12 3l9 4.5V9H3V7.5L12 3z" fill="currentColor" opacity=".9"/>
      <path d="M5.5 10.5v7M9.5 10.5v7M14.5 10.5v7M18.5 10.5v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M3 19.5h18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <span>数字博物馆<em>3D Museum</em></span>
  </a>
  <nav class="nav-links">
    <a href="./index.html">全部展厅</a>
  </nav>
</header>

<main class="credits">
  <h1>图源与授权</h1>
  <p class="lede">
    本馆 31 件展品均为基于真实原型的程序化三维表达。模型几何、比例与形态参考公开授权的博物馆图像、
    学术复原图及权威尺寸数据；纹理图片遵循其原始许可证。CC BY / CC BY-SA 类素材已在下方署名。
  </p>
  <div id="groups"></div>
</main>

<footer class="foot">
  <span>数字博物馆 3D 可视化工作台</span>
  <span class="dot">·</span>
  <span><a href="./credits.html">图源与授权</a></span>
  <span class="dot">·</span>
  <span>Three.js WebGL · 全内联零外链</span>
</footer>

<script type="module">
import { EXHIBITS, HALLS } from './js/data.js';

const root = document.getElementById('groups');
const hallMap = new Map(HALLS.map(h => [h.id, h]));
const byHall = HALLS.map(h => ({ hall: h, items: EXHIBITS.filter(e => e.hall === h.id) }));

for (const { hall, items } of byHall) {
  const group = document.createElement('section');
  group.className = 'hall-group';
  group.innerHTML = `
    <h2 class="hall-title">${hall.name}<span>${hall.en}</span></h2>
    <table class="credit-table">
      <thead>
        <tr>
          <th>展品</th>
          <th>年代</th>
          <th>许可证</th>
          <th>来源 / 署名</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(e => `
          <tr>
            <td data-label="展品" class="name">${e.name}</td>
            <td data-label="年代" class="era">${e.era}</td>
            <td data-label="许可证" class="license">${e.license || '-'}</td>
            <td data-label="来源 / 署名">${e.credit || '-'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  root.appendChild(group);
}
</script>
</body>
</html>
