<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>展厅详情 · 数字博物馆</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./css/site.css">
</head>
<body class="page-hall">

<div class="bg-grid" aria-hidden="true"></div>

<header class="nav">
  <a class="brand" href="./index.html">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M12 3l9 4.5V9H3V7.5L12 3z" fill="currentColor" opacity=".9"/>
      <path d="M5.5 10.5v7M9.5 10.5v7M14.5 10.5v7M18.5 10.5v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M3 19.5h18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <span>数字博物馆<em>3D Museum</em></span>
  </a>
  <nav class="nav-links">
    <a href="./index.html">全部展厅</a>
  </nav>
</header>

<main class="detail">
  <section class="d-hero" id="dHero">
    <a class="d-back" href="./index.html">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      全部展厅
    </a>
    <p class="d-en" id="dEn"></p>
    <h1 id="dName"></h1>
    <p class="d-tag" id="dTag"></p>
    <p class="d-intro" id="dIntro"></p>
    <ul class="d-tags" id="dTags"></ul>

    <div class="d-cta">
      <a class="btn btn-primary btn-lg" id="dEnter" href="#">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20v-6h4v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        进入 3D 展厅
      </a>
      <a class="btn btn-ghost" id="dTour" href="#">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
        自动导览
      </a>
    </div>

    <dl class="d-spec" id="dSpec"></dl>
  </section>

  <section class="d-plan">
    <div class="sec-hd sm">
      <h2>展厅平面</h2>
      <p>灰块为展台，编号对应下方展品清单</p>
    </div>
    <div class="plan-wrap"><svg id="planSvg" viewBox="0 0 800 500" role="img" aria-label="展厅平面图"></svg></div>
  </section>

  <section class="d-list">
    <div class="sec-hd sm">
      <h2>展品清单 <em id="exCount"></em></h2>
      <p>点击任一展品，进入展厅后直接聚焦到它</p>
    </div>
    <div class="ex-grid" id="exGrid"></div>
  </section>
</main>

<footer class="foot">
  <span>数字博物馆 3D 可视化工作台</span>
  <span class="dot">·</span>
  <span><a href="./credits.html">图源与授权</a></span>
  <span class="dot">·</span>
  <span>Three.js WebGL · 全内联零外链</span>
</footer>

<script type="module" src="./js/hall.js"></script>
</body>
</html>
