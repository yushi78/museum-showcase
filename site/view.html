<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>3D 展厅 · 数字博物馆</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./css/viewer.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<canvas id="stage"></canvas>

<!-- 顶部信息栏 -->
<header class="topbar">
  <a class="back" href="./index.html" title="返回首页">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="tb-title">
    <b id="hallName">展厅</b>
    <span><i id="hallTpl">模板</i> · 共 <i id="hallCount">0</i> 件展品</span>
  </div>
  <button id="sideToggle" class="tb-btn" title="展品目录 (L)">
    <svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>目录</span>
  </button>
</header>

<!-- 展品目录 -->
<aside id="side">
  <div class="side-hd">展品目录 <em id="listCount">0</em></div>
  <ul id="list"></ul>
</aside>

<!-- 准星 / 提示 -->
<div id="crosshair"></div>
<div id="tip" class="hide"></div>

<div id="lockHint" class="hint hide">
  <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3a4 4 0 014 4v3h1a2 2 0 012 2v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7a2 2 0 012-2h1V7a4 4 0 014-4zm0 2a2 2 0 00-2 2v3h4V7a2 2 0 00-2-2z" fill="currentColor"/></svg>
  点击画面锁定鼠标开始漫游
</div>

<div id="roamHelp" class="hint roam-help hide">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>Shift</kbd> 加速 · 鼠标转向 · <kbd>Esc</kbd> 解锁 · 点击展品查看信息
</div>

<!-- 导览控制条 -->
<div id="tourBar" class="hide">
  <button id="tPrev" title="上一件">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="tPlay">暂停</button>
  <span id="tourNow">准备中…</span>
  <button id="tNext" title="下一件">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<!-- 摇杆（移动端漫游） -->
<div id="joy" class="hide"><div class="knob"></div></div>

<!-- 小地图 -->
<canvas id="minimap" width="188" height="150"></canvas>

<!-- 模式切换 -->
<div class="modes">
  <button class="mode-btn on" data-mode="roam">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2l3.5 7.5L23 11l-5.5 5 1.5 8-7-4-7 4 1.5-8L1 11l7.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span>漫游</span>
  </button>
  <button class="mode-btn" data-mode="top">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 7l9-4 9 4-9 4-9-4zm0 5l9 4 9-4M3 17l9 4 9-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span>俯瞰</span>
  </button>
  <button class="mode-btn" data-mode="tour">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="12" r="2.2" fill="currentColor"/></svg>
    <span>导览</span>
  </button>
</div>

<!-- 信息面板 -->
<section id="panel">
  <button id="pClose" title="关闭">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="p-cat" id="pCat"></div>
  <h2 id="pTitle"></h2>
  <div class="p-en" id="pEn"></div>

  <dl class="p-meta">
    <div><dt>年代</dt><dd id="pEra"></dd></div>
    <div><dt>材质</dt><dd id="pMat"></dd></div>
  </dl>

  <p class="p-desc" id="pDesc"></p>
  <div class="p-facts" id="pFacts"></div>
  <div class="p-slot" id="pSlot"></div>
  <button id="pFocus" class="p-focus">
    <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    聚焦此展品
  </button>
</section>

<!-- 加载遮罩 -->
<div id="loader">
  <div class="ld-box">
    <div class="ld-ring">
      <svg viewBox="0 0 48 48" width="48" height="48">
        <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/>
        <circle cx="24" cy="24" r="20" fill="none" stroke="var(--accent,#2f6df6)" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="40 126"><animateTransform attributeName="transform"
                type="rotate" from="0 24 24" to="360 24 24" dur="1.1s" repeatCount="indefinite"/></circle>
      </svg>
    </div>
    <div class="ld-t">正在构建 3D 展厅</div>
    <div class="ld-bar"><i id="barFill"></i></div>
    <div class="ld-s" id="loadText">加载模型资源…</div>
  </div>
</div>

<footer class="foot">
  <span>数字博物馆 3D 可视化工作台</span>
  <span class="dot">·</span>
  <span><a href="./credits.html">图源与授权</a></span>
  <span class="dot">·</span>
  <span>Three.js WebGL · 全内联零外链</span>
</footer>

<script type="module" src="./js/viewer.js"></script>
</body>
</html>
