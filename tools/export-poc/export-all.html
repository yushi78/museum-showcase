<!doctype html>
<meta charset="utf-8">
<title>批量导出真实展品 GLB</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; background: #f7f7f7; }
  #log { background: #111; color: #0f0; padding: 16px; border-radius: 8px; font-family: monospace; height: 460px; overflow: auto; white-space: pre-wrap; }
  button { padding: 10px 18px; margin: 8px 8px 0 0; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  .fail { color: #ff6b6b; }
  .ok { color: #51cf66; }
</style>
<h1>批量导出 31 件真实展品 GLB</h1>
<button id="run">开始批量导出</button>
<div id="log"></div>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { CLASSICAL } from '/tools/models/classical.mjs';
import { NATURAL } from '/tools/models/natural.mjs';
import { MODERN } from '/tools/models/modern.mjs';

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.textContent = msg;
  if (cls) line.className = cls;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function upload(id, arrayBuffer) {
  const res = await fetch('/upload/' + id, {
    method: 'POST',
    headers: { 'Content-Type': 'model/gltf-binary' },
    body: arrayBuffer,
  });
  return res.json();
}

async function exportOne(id, builder) {
  try {
    log(`[${id}] 构建中...`);
    const obj = await builder();
    const scene = new THREE.Scene();
    scene.add(obj);

    // 标准化姿态
    const box = new THREE.Box3().setFromObject(obj, true);
    const c = box.getCenter(new THREE.Vector3());
    obj.position.x -= c.x;
    obj.position.z -= c.z;
    obj.position.y -= box.min.y;

    const exporter = new GLTFExporter();
    const glb = await exporter.parseAsync(scene, { binary: true });
    const sizeKB = (glb.byteLength / 1024).toFixed(1);
    const r = await upload(id, glb);
    if (r.ok) log(`[${id}] ✓ ${sizeKB} KB`, 'ok');
    else log(`[${id}] ✗ 上传失败`, 'fail');
    return r.ok;
  } catch (e) {
    log(`[${id}] ✗ ${e.message}`, 'fail');
    console.error(e);
    return false;
  }
}

window.exportAll = async () => {
  const all = { ...CLASSICAL, ...NATURAL, ...MODERN };
  const ids = Object.keys(all);
  log(`共 ${ids.length} 件展品待导出`);
  let ok = 0;
  for (const id of ids) {
    const success = await exportOne(id, all[id]);
    if (success) ok++;
  }
  log(`\n完成：${ok}/${ids.length}`);
};

document.getElementById('run').addEventListener('click', () => window.exportAll());
</script>
